[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-ascii"
version = "0.2.0"
description = "Accurate image-to-ASCII art for anime-style character silhouettes and portraits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bronglil" }]
dependencies = [
  "Pillow>=10.0,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]
web = ["Flask>=3.0,<4", "Werkzeug>=3.0,<4"]

[project.scripts]
anime-ascii = "anime_ascii.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
