<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>anime-ascii · Design Cards</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <p class="brand">anime-ascii</p>
      <h1>Colored design cards</h1>
      <p class="lede">Choose a character, then a style — ASCII keeps the image colors.</p>
    </div>
    <div class="selection" id="selection">
      <span class="muted">Nothing selected</span>
    </div>
  </header>

  <section class="block">
    <h2>Characters</h2>
    <div class="grid chars" id="char-grid"></div>
  </section>

  <section class="block">
    <h2>Design styles</h2>
    <div class="grid designs" id="design-grid"></div>
  </section>

  <section class="block preview-block">
    <div class="preview-head">
      <h2>Preview</h2>
      <div class="actions">
        <button type="button" id="copy-btn" disabled>Copy plain</button>
        <button type="button" id="copy-html-btn" disabled>Copy HTML</button>
      </div>
    </div>
    <div id="preview" class="ascii-frame">Select a character and a design…</div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
