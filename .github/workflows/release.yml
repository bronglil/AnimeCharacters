name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish (e.g. v0.5.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: js/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Pack npm tarball
        working-directory: js
        run: |
          npm ci
          npm test
          npm pack
          ls -la ./*anime-ascii*.tgz || ls -la ./*.tgz

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: anime-ascii ${{ github.ref_name }}
          generate_release_notes: true
          files: js/*anime-ascii*.tgz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npmjs (@lilbrong/anime-ascii)
        working-directory: js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN secret is not set — skipping npmjs publish."
            exit 0
          fi
          # ensure npmjs scope name
          npm pkg set name=@lilbrong/anime-ascii
          npm publish --access public
          echo "Published $(node -p "require('./package.json').name+'@'+require('./package.json').version") to npmjs"

      - name: Publish to GitHub Packages (@bronglil/anime-ascii)
        working-directory: js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Packages requires scope = GitHub owner
          npm pkg set name=@bronglil/anime-ascii
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          echo "@bronglil:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          npm publish
          echo "Published @bronglil/anime-ascii@$(node -p "require('./package.json').version") to GitHub Packages"
